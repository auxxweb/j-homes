name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the site
        env:
          VITE_BASE: /j-homes/
          VITE_SITE_URL: https://auxxweb.github.io/j-homes
          VITE_PHONE: ${{ secrets.VITE_PHONE }}
          VITE_PHONE_DISPLAY: ${{ secrets.VITE_PHONE_DISPLAY }}
          VITE_EMAIL: ${{ secrets.VITE_EMAIL }}
          VITE_WHATSAPP: ${{ secrets.VITE_WHATSAPP }}
          VITE_INSTAGRAM: ${{ secrets.VITE_INSTAGRAM }}
          VITE_FACEBOOK: ${{ secrets.VITE_FACEBOOK }}
          VITE_ENQUIRY_ENDPOINT: ${{ secrets.VITE_ENQUIRY_ENDPOINT }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
        run: npm run build
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
