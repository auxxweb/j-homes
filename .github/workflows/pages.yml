name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the site
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://www.jhomes.in
          VITE_PHONE: ${{ secrets.VITE_PHONE }}
          VITE_PHONE_DISPLAY: ${{ secrets.VITE_PHONE_DISPLAY }}
          VITE_EMAIL: ${{ secrets.VITE_EMAIL }}
          VITE_WHATSAPP: ${{ secrets.VITE_WHATSAPP }}
          VITE_INSTAGRAM: ${{ secrets.VITE_INSTAGRAM }}
          VITE_FACEBOOK: ${{ secrets.VITE_FACEBOOK }}
          VITE_ENQUIRY_ENDPOINT: https://script.google.com/macros/s/AKfycbzQvzLXoUHsKT0R6Rb9omDG5MpwoEbmKjb1kp1FB7WsZBlBaZAmc_FmUcC3Bk1DXej5/exec
          VITE_CHECKLIST_ENDPOINT: https://script.google.com/macros/s/AKfycbw8LV8rXrezJb__YgMQ1SDz37iDzKnfZGbKI45elmPhkCRMXWYw_pz5eRpALlceN_1wWQ/exec
          VITE_CHECKLIST_TOKEN: PASTE_A_LONG_RANDOM_TOKEN
          VITE_JOURNAL_ENDPOINT: https://script.google.com/macros/s/AKfycbxlEkOakBkJKfH-tRqynVJMw44MR3pT-WT9IxYjE8DQVtUkK1oBUCCCKVn3JU0Ytfra/exec
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
        run: npm run build
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
